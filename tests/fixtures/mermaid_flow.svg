<svg xmlns="http://www.w3.org/2000/svg" id="mermaid-7" width="100%" viewBox="0 0 300 200" style="max-width: 300px; font-size: 16px;">
  <style>
    .cluster rect { fill: #ffffde; stroke: #aaaa33; }
    .node rect { fill: #ececff; stroke: #9370db; stroke-width: 1px; }
    .node .label { fill: #333333; }
    .cluster-label text { fill: #333333; font-size: 16px; }
    @keyframes edge-animation-frame { from { stroke-dashoffset: 0; } }
  </style>
  <g class="cluster" id="flowchart-sub-0">
    <rect x="10" y="10" width="280" height="180"/>
    <g class="cluster-label" transform="translate(150, 10)">
      <foreignObject width="100" height="20">
        <div xmlns="http://www.w3.org/1999/xhtml"><span class="nodeLabel">Pipeline</span></div>
      </foreignObject>
    </g>
    <g class="node" id="flowchart-A-0" transform="translate(90, 100)">
      <rect x="-35" y="-20" width="70" height="40"/>
      <g class="label" transform="translate(-12, -8)">
        <text><tspan x="0" dy="1em">Load</tspan></text>
      </g>
    </g>
    <g class="node" id="flowchart-B-1" transform="translate(210, 100)">
      <rect x="-35" y="-20" width="70" height="40"/>
      <g class="label" transform="translate(-20, -8)">
        <text><tspan x="0" dy="1em">Clean</tspan></text>
      </g>
    </g>
    <path d="M 125 100 L 175 100" fill="none" stroke="#333333"/>
    <g class="edgeLabel" transform="translate(150, 100)">
      <g class="label" transform="translate(-8, -8)">
        <text><tspan x="0" dy="1em">svg</tspan></text>
      </g>
    </g>
  </g>
</svg>
