[project]
name = "svg-cleaner"
version = "0.1.0"
description = "Clean up SVG files: optimize structure, inline CSS, trim clipped strokes and repair mermaid-cli exports."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["svg", "optimizer", "cleaner", "bokeh", "mermaid", "inkscape"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
  "Environment :: Console",
]
dependencies = [
  "lxml>=5.0",
  "cssselect>=1.2",
  "tinycss2>=1.2",
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
svg-cleaner = "svg_cleaner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/svg_cleaner"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
